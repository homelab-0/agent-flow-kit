name: release-please

# Every push to master updates one open release PR ("chore: release x.y.z")
# that bumps the version from the conventional-commit PR titles merged since
# the last release and writes CHANGELOG.md. Merging that PR is the release:
# release-please tags the merge commit and creates the GitHub release with
# the changelog as its notes, and release.yml then builds, signs and
# publishes to npm on the new tag.
#
# It runs as the Lb0Bot0 GitHub App, so the release PR, tag and release show
# as Lb0Bot0, CI runs on the release PR, and the tag fires release.yml's
# `push: tags` like a hand-pushed tag. It needs LB0BOT0_CLIENT_ID (a secret or a
# variable) and the LB0BOT0_PRIVATE_KEY secret, at repo or org level, and the
# app installed on this repo with Contents, Pull requests and Issues
# read/write.
#
# Until those are set it falls back to GITHUB_TOKEN. A tag made with
# GITHUB_TOKEN doesn't fire `push: tags`, so in that case this workflow
# starts release.yml itself with workflow_dispatch on the tag ref; the run's
# ref is still refs/tags/vX.Y.Z, so the cosign identity is unchanged.
on:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # fallback only: tag, release, release branch
      pull-requests: write   # fallback only: the release PR
      issues: write          # fallback only: release PR labels
      actions: write         # fallback only: dispatch release.yml
    steps:
      - name: Check for the Lb0Bot0 app
        id: bot
        env:
          CLIENT_ID: ${{ secrets.LB0BOT0_CLIENT_ID || vars.LB0BOT0_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.LB0BOT0_PRIVATE_KEY }}
        run: |
          if [ -n "$CLIENT_ID" ] && [ -n "$PRIVATE_KEY" ]; then
            echo "use=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::LB0BOT0_CLIENT_ID or LB0BOT0_PRIVATE_KEY is not set, so release-please runs as github-actions[bot]"
          fi
      - name: Get an Lb0Bot0 token
        id: app
        if: steps.bot.outputs.use == 'true'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.LB0BOT0_CLIENT_ID || vars.LB0BOT0_CLIENT_ID }}
          private-key: ${{ secrets.LB0BOT0_PRIVATE_KEY }}
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app.outputs.token || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # With the app token the tag push already started release.yml.
      - name: Publish the release (GITHUB_TOKEN fallback)
        if: steps.rp.outputs.release_created == 'true' && steps.bot.outputs.use != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.rp.outputs.tag_name }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
