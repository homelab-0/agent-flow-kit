name: release

# A release tag like v0.1.0 builds the six platform archives, writes the
# SHA-256 checksums, signs them with keyless cosign, attaches them to the
# GitHub release, and publishes @homelab0/afk to npm with provenance (when
# the NPM_TOKEN secret is set).
#
# release-please.yml creates the tag and the GitHub release when its
# release PR merges; GoReleaser adds the assets to that release and keeps
# its notes. The tag is pushed by the Lb0Bot0 app, which fires `push: tags`.
# If release-please fell back to GITHUB_TOKEN, it starts this run with
# workflow_dispatch on the tag instead. A tag pushed by hand also works.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub release
      id-token: write   # keyless cosign signing and npm provenance
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Check the run is on a release tag
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) echo "::error::run this on a v* tag, not $GITHUB_REF"; exit 1 ;;
          esac
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test ./...
      - uses: sigstore/cosign-installer@v3
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Build npm packages
        run: node npm/build.mjs "${GITHUB_REF_NAME#v}" dist npm/out
      - name: Publish to npm
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          tag=latest
          case "$version" in *-*) tag=next ;; esac
          # Platform packages first, so the wrapper never points at a
          # missing one. A version that is already published is skipped,
          # so a re-run picks up where a failed run stopped.
          for dir in npm/out/afk-* npm/out/afk; do
            name=$(node -p "require('./$dir/package.json').name")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published"
              continue
            fi
            npm publish "$dir" --provenance --access public --tag "$tag"
          done
      - name: Skip npm
        if: env.NPM_TOKEN == ''
        run: echo "::warning::NPM_TOKEN is not set, so nothing was published to npm"
