name: pr-title

# PRs are squash-merged, so the PR title becomes the commit release-please
# reads. It must be a conventional commit: feat: and fix: (optionally with a
# scope, e.g. fix(router): ...) go in the changelog and bump the version;
# a "!" after the type, or a BREAKING CHANGE footer, marks a breaking change.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            revert
            docs
            refactor
            test
            build
            ci
            chore
          requireScope: false
