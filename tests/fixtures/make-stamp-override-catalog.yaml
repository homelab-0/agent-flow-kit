version: "1.9.1"
schema_version: 1
updated: "2026-09-25"
epic: EPIC-035
story: STORY-035-1
consumers: []
defaults:
  placement_policy: prefer-warm-local
harnesses:
  claude:
    description: >-
      Claude Code sessions driven by the operator's own Anthropic subscription. The harness resolves its own model unless the physical model it is given pins an upstream_model_id, which is then passed verbatim as --model under the launch rule defined in ai-control-plane's contracts/agent-router/HARNESS-LAUNCH-claude.md section 4.
    supported: true
    selectable: true
  codex:
    description: >-
      OpenAI Codex CLI sessions driven by the operator's own ChatGPT subscription. The harness resolves its own model unless the physical model it is given pins an upstream_model_id, which is then passed verbatim as --model under the launch rule defined in ai-control-plane's contracts/agent-router/HARNESS-LAUNCH-codex.md section 4.
    supported: true
    selectable: true
  devin:
    description: >-
      Devin (Cognition) cloud sessions, including the free `swe-1-7*` tier on the existing Teams account.
    supported: true
    selectable: true
  opencode:
    description: >-
      OpenCode headless worker sessions using provider-qualified models and harness-owned native subscription stores. The launch adapter and approved-pair policy are implemented, but production activation is held until live ChatGPT and MiniMax canaries prove subscription identity, containment, sanitizer and completion behavior.
    supported: false
    selectable: false
    reason: opencode-live-subscription-and-launch-canaries-required
    router_behaviour: refuse-to-emit
  local-agent:
    description: >-
      RESERVED placeholder so the harness axis is future-proof. This is NOT a harness today and NOT a slot to be filled opportunistically.
    supported: false
    selectable: false
    reason: invariant-16-reserved-unsupported
    router_behaviour: refuse-to-emit
placements:
  kserve-a5000:
    description: >-
      The only real placement today: KServe/Knative InferenceServices on the cluster's single RTX A5000 node. Every model in this catalog that has a placement, has this one.
    status: available
    selectable: true
    kind: kserve
    node: k8s-work-10
    gpu:
      vendor: nvidia
      model: RTX A5000
    capacity:
      vram_gb: 24
      vram_gb_nameplate: 24
      source: measured
    runtime: >-
      KServe v0.13.1 on Knative Serving; per-model containers are llama.cpp server-cuda or vLLM / vLLM-Omni.
    preemptible: false
    scale_to_zero: true
    concurrent_models: 1
    cold_start_s_estimate: 150
    cold_start_source: measured
    cold_start_evidence: >-
      130.6-150 s to first token via the gateway (34.4 kill gate); 120.9 s re-measured 2026-08-19. Per-model vLLM figures 97-150 s from the InferenceService records.
    notes: >-
      Invariant 7: nothing may pin a model warm here by default. Scale-to-zero and the GPU economics it buys are load-bearing.
  cachyos-7900xtx:
    description: >-
      LAN edge worker on the operator's CachyOS workstation. Brought up by 35.6/35.6a, physically validated against kserve-a5000 by 35.7, and proven reachable by name with strict TLS+bearer by 35.8pre (cachyos-7900xtx.homelab0.org, 200 / 401 / 401 / TLS rc=60). Wired into agentgateway as a second grouped-backend placement by 35.8.
    status: available
    selectable: true
    kind: edge
    node: null
    gpu:
      vendor: amd
      model: Radeon RX 7900 XTX
      arch: gfx1100
    capacity:
      vram_gb: null
      vram_gb_nameplate: 24
      source: unmeasured
    runtime: llama-swap fronting llama.cpp (ROCm)
    preemptible: true
    scale_to_zero: null
    concurrent_models: null
    cold_start_s_estimate: 6
    cold_start_source: measured
    cold_start_evidence: >-
      35.7 edge cold-load benchmark (unloaded model -> first token), N=5: min 5.491s, median 5.520s, max 5.547s, spread 0.056s - two orders of magnitude tighter than kserve-a5000's cold-start spread. Rounded up for the estimate field; the distribution itself is the evidence.
    notes: >-
      Invariant 8: the machine's interactive desktop work outranks AI, absolutely and without a cluster round-trip. Withdrawal is by silence and by 503. Ruling R4's transport bar (HTTPS, bearer auth, a real CA, a hostname SAN, a dedicated host key, no insecureSkipVerify, secrets outside Git) is met - see 35.8's agentgateway wiring in agentgateway-pilot/app.
  bazzite-5090:
    description: >-
      LAN edge worker on the operator's Bazzite gaming host. Brought up and measured against contracts/edge-worker/EDGE-WORKER-CONTRACT.md in ai-control-plane (35.13): conformance 7/7 with strict TLS+bearer, interactive-withdrawal and fail-closed-lease drills passed, heartbeat accepted by agent-router. Wired into agentgateway as the qwen36-27b-bazzite-preferred grouped backend (x-placement: bazzite-5090 only; the headerless default never lands here). Evidence: edge/ancestors/bazzite/ACCEPTANCE.md in ai-control-plane.
    status: available
    selectable: true
    kind: edge
    node: null
    gpu:
      vendor: nvidia
      model: GeForce RTX 5090
      arch: sm_120
    capacity:
      vram_gb: 31.8
      vram_gb_nameplate: 32
      source: measured
    runtime: llama-swap fronting llama.cpp (CUDA)
    preemptible: true
    scale_to_zero: null
    concurrent_models: null
    cold_start_s_estimate: 4
    cold_start_source: measured
    cold_start_evidence: >-
      35.13 cold-load benchmark on-host (model unloaded -> first streamed token), N=5: min 3.462s, median 3.468s, max 3.497s, spread 0.035s - 17.9 GB GGUF from local NVMe. Rounded up for the estimate field; the distribution itself is the evidence.
    notes: >-
      Ruling R2 applies hardest here: once a response stream has begun, a broken stream fails the execution attempt. The gateway does not rescue a mid-stream withdrawal - which on this host is a normal event whenever a human takes the GPU (detection ~8s, endpoint refusal ~1s later, measured). Deliberately LAST in every placements/physical list and in every prefer_order: fastest cold start in the fleet, least reliable tenancy.
  laptop-rtx5000:
    description: >-
      Planned, CONDITIONAL edge worker. The hardware has not been inspected: "RTX 5000" is ambiguous across generations and no SKU, VRAM figure or thermal behaviour has been established.
    status: planned
    selectable: false
    kind: edge
    node: null
    gpu:
      vendor: nvidia
      model: null
      arch: null
    capacity:
      vram_gb: null
      vram_gb_nameplate: null
      source: unmeasured
    runtime: null
    preemptible: true
    scale_to_zero: null
    concurrent_models: null
    cold_start_s_estimate: null
    cold_start_source: unmeasured
    blocked_by: ["35.14"]
    notes: >-
      Hardware detection is task 1 of 35.14 and no profile may assume model viability here until it lands. Even once detected, this host advertises only when cluster-reachable AND on AC power AND GPU idle AND thermally healthy.
