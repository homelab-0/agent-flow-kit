profiles:
  local-code-standard:
    description: >-
      The default local coding profile. Long context and tool calling, which is what makes it usable for agentic work.
    cost_class: free
    hosting: local
    selectable: true
    capabilities: [chat, tools]
    min_context: 65536
    alignment: standard
    forbidden_for: []
    entitlements:
      - pool: null
        cost_class: free
    physical:
      - model_id: qwen36-27b
        placement: cachyos-7900xtx
      - model_id: qwen36-27b
        placement: kserve-a5000
      - model_id: qwen36-27b
        placement: bazzite-5090
    notes: >-
      Three candidates as of 1.4.0: the edge (cachyos-7900xtx) is listed first to match policies.placement_policy.prefer-warm-local's prefer_order, and bazzite-5090 last - its gaming/interactive priority makes it the least reliable tenancy despite the fastest cold start. Ordering here is a preference hint only - the placement_policy on the request is what actually decides, per profile/policy/placement being independent axes.

      LAUNCH PATH (added 1.6.0, STORY-036-2). Until now this profile resolved to a NAME and nothing more: a consumer could learn that {harness: claude, model_profile: local-code-standard} was an approved decision, but not how to start it. What follows is the path STORY-036-1 actually validated on 2026-08-30, recorded the way minimax/strong records its own wiring. Evidence: contracts/agent-router/evidence/STORY-036-1-local-launch-validation.md - "R1".."R17" below are that file's numbered requirements; where an OWNER RULING is meant it is written as "owner ruling Rn".

      The path is the `claude` harness driven against the gateway's Anthropic-compatible /v1/messages endpoint, authenticated with the scoped agentgateway-claude-code key and served by qwen36-27b. A real Claude Code session completed successfully through it (R3); the served model was established from live response bodies and gateway telemetry rather than from configuration, and the upstream string returned (qwen3.6-27b) differs from the string the client sent, so it cannot be an echo (R4); and a full tool_use -> tool_result -> synthesis round trip ran over two /v1/messages calls, which is what licenses this profile's `tools` guarantee ON THIS PATH specifically (R5).

      THE LAUNCH CONTRACT IS EXACTLY FOUR VARIABLES, set per-process on the harness: ANTHROPIC_BASE_URL (the gateway), ANTHROPIC_AUTH_TOKEN (the scoped key, conveyed as an Authorization bearer header rather than x-api-key), ANTHROPIC_MODEL, and ANTHROPIC_CUSTOM_HEADERS carrying the placement header. This is what passed, not an idealised contract: R9 confirmed the last two convey from a real session both at the wire and by gateway route-section selection, so the agreed degraded headerless fallback was not needed.

      ANTHROPIC_MODEL=qwen36-27b IS REQUIRED, NOT PREFERRED. Unpinned Claude Code 2.1.251 sends "model": "claude-opus-5" in the request body (R1), which is not in the gateway's CEL alias list, and a real unpinned session against the live gateway was refused with 403 authorization failed, the access log naming the body-consistency clause (R2). The zero-config path is broken today: a consumer that omits the pin gets no completion at all, not a degraded one.

      A KNOWN CAVEAT ON TOP OF THE CONTRACT, NOT A FIFTH VARIABLE: THE CONTEXT WINDOW. Claude Code does not recognise `qwen36-27b` as a model id. It emits [claude-code:unrecognized_model] on every launch and assumes a 200,000-token window for auto-compaction, while this profile's real max_context is 65536 - so a long session compacts far too late and can overrun the model. A consumer should set CLAUDE_CODE_MAX_CONTEXT_TOKENS, or an equivalent model override, to the real 65536. Note the status of this deliberately: the four variables above are the contract STORY-036-1 exercised and passed, whereas this window behaviour was OBSERVED during that validation (evidence finding F3) and was never itself exercised - the sessions were far too short to reach the boundary. It is a caveat a consumer must handle. It does not make the contract five variables.

      PLACEMENT IS CONVEYED BY THE x-placement REQUEST HEADER, and its value is never composed by hand. It is copied verbatim from the `headers` object of a POST /v1/place result (R6). Pinning was settled at the routing layer, the only place it can be: pinned requests selected the placement-scoped route section, distinct from the headerless default section (R7).

      THE UNIT OF PLACEMENT IS THE SESSION, NOT THE TURN. A place result carries ttl_seconds: 30 and is therefore point-in-time, but ANTHROPIC_CUSTOM_HEADERS is fixed when the harness process starts and cannot be refreshed while it runs. One Claude Code session therefore pins ONE placement for its entire lifetime, and "resolved late, per attempt" means PER SESSION - per launch - not per turn. Fetch a fresh /v1/place result immediately before starting a session, and RELAUNCH a long-running session to re-place it. A session cannot re-place itself and must not be expected to.

      The consequence is bounded, and it is a FRESHNESS limitation rather than a correctness or authorization one. A session outliving its 30 s TTL keeps sending the placement it started with, which may since have been withdrawn - and a withdrawn or stale placement degrades to the frozen headerless default and is served normally rather than failing (R10, R11). What it costs is latency, not an answer: with the pinned placement genuinely down, the request still returned a correct completion, after roughly 10 s of added latency spent failing to reach it (R12). Relaunch to re-place when that cost matters; nothing breaks if you do not.

      PLACEMENTS DEMONSTRATED ON THIS PATH: kserve-a5000 ONLY (R6, R7). cachyos-7900xtx and bazzite-5090 were held ineligible for the entire validation window and /v1/place never emitted them, so nothing here claims them; they are added by a later data-only catalog PR once those hosts are up (R8). Their non-emission is itself positive evidence of late binding: the router named both edges as rejected and why, rather than silently narrowing, and under edge-only it returned status: unavailable with a null placement rather than falling through to the cluster placement the caller had excluded (R8). Eligibility is live runtime state, not catalog data - all three read available/selectable here while only one was actually eligible.

      x-placement REMAINS A SCHEDULING SIGNAL ONLY (owner ruling R5). It is never an authorization input and nothing above makes it one. Authorization stays where it has always been: the per-section CEL policy binding the request-body model, which is never derived from the header. R13 shows the separation directly - the same key is refused 403 for any other body model no matter what placement is asked for, and 401 outside its credential set entirely.

      THE HEADERLESS DEFAULT IS THE FROZEN SAFE DEFAULT. An absent or stale header degrades to it rather than redirecting traffic: headerless requests landed on the default route section and were served from kserve-a5000, by curl and by a real session alike (R10), and both a stale-but-real placement name and a garbage one fell through to that same default and were served normally (R11). So an expired ttl_seconds: 30 place result costs correctness nothing, and no missing header can silently redirect production traffic onto a human's desktop. Safe is not free, though: with both edges genuinely down, a request pinned at an edge still returned a correct completion from the cluster provider but paid roughly 10 s of added latency first (R12) - a single observation under one failure mode, recorded as such and not as a guarantee.

      ECONOMICS. cost_class: free is correct and now evidenced rather than merely reasoned. The credential is a LAN-scoped agentgateway key granting NO METERED SPEND: it authenticates only to this gateway's qwen36-27b sections and is refused everywhere else (R13); no request in the validation reached a vendor endpoint and no ANTHROPIC_API_KEY was set at any point (R14); and spillover is structurally `none` because the entitlement is pool: null and no metered entitlement exists anywhere in this catalog to spill into (R15). An API-key-shaped credential does not imply metered - see TABLE 4. One caveat a consumer must handle - Claude Code's own result envelope reports a non-zero total_cost_usd on this path, computed from the CLI's internal price table with costBasis: unknown. It is a client-side estimate, not spend; the local model has no price. Anything aggregating session cost must exclude hosting: local profiles or it will over-report (R14).

      CREDENTIAL ISOLATION IS PART OF THE CONTRACT, exactly as for minimax/strong. The base URL and token reach the worker's own process or session ONLY. STORY-036-1 set all four variables per-process on the harness subprocess: no ANTHROPIC_API_KEY was set at any point, CLAUDE_CONFIG_DIR was never set, the global Anthropic configuration was not rewritten, and nothing was exported into the operator's shell. The key lives in 1Password, scoped to this gateway path, and never in Git.

      The endpoint itself is deliberately NOT recorded here as data. agentgateway is the only model ingress (invariant 5) and endpoint discovery is runtime state from the heartbeat contract; the paragraphs above are prose provenance, not routable fields.
  "claude/standard":
    description: >-
      Standard-tier vendor model via the claude harness's own subscription. Not proxied, not placed, not metered.
    cost_class: subscription
    hosting: vendor
    selectable: true
    capabilities: [chat, tools]
    min_context: 1000000
    alignment: standard
    forbidden_for: []
    entitlements:
      - pool: anthropic-max
        cost_class: subscription
    physical:
      - model_id: "claude/sonnet"
        placement: null
    notes: >-
      The everyday Anthropic tier below claude/strong: routine, well-specified work that does not need the strong model. Same subscription, same isolation rules and the same `placement: null` as claude/strong.
  "claude/strong":
    description: >-
      Strong vendor model via the claude harness's own subscription. Not proxied, not placed, not metered.
    cost_class: subscription
    hosting: vendor
    selectable: true
    capabilities: [chat, tools]
    min_context: 1000000
    alignment: standard
    forbidden_for: []
    entitlements:
      - pool: anthropic-max
        cost_class: subscription
    physical:
      - model_id: "claude/opus"
        placement: null
    notes: >-
      `placement: null` is the correct value, not a gap: placement names are agentgateway provider names and this traffic never touches agentgateway. Invariant 10 - this is a subscription, not an API key; nothing here authorises introducing ANTHROPIC_API_KEY or centralising an OAuth token. G9/35.17 concern proxying subscription traffic through cluster ingress, which this profile does not do.
  "openai/strong":
    description: >-
      Strong vendor OpenAI model through the codex harness's own subscription. Stamped as the standing fallback tier in EPIC-035 section 11. Pinned to openai/gpt-6-sol (1.8.1, STORY-035-9f): unlike ACP's own reference catalog, which keeps this profile on openai/gpt-5.6-sol because gpt-6-sol was untested there, this deployment measured gpt-6-sol launching through codex on the subscription and reporting as itself, so it moved. OpenCode remains catalog-disabled pending its live ChatGPT canary.
    cost_class: subscription
    hosting: vendor
    selectable: true
    capabilities: [chat, tools]
    min_context: 258400
    alignment: standard
    forbidden_for: []
    entitlements:
      - pool: openai-plus
        cost_class: subscription
    physical:
      - model_id: "openai/gpt-6-sol"
        placement: null
policies:
  placement_policy:
    prefer-warm-local:
      description: >-
        Default. Take whatever is already warm; otherwise prefer the edge (cachyos-7900xtx measures a ~6s cold start against kserve-a5000's conservative 150s estimate), then the cluster GPU, then the remaining edge hosts in order of expected availability. R25 frozen decision table: edge warm/KServe cold -> edge; edge cold/KServe warm -> KServe; both warm -> edge; both cold or unknown -> edge; edge ineligible -> KServe. The first two rows follow from warm_preference: strict alone (any warm candidate beats any cold one, regardless of prefer_order); the last three follow from prefer_order alone, once no candidate is known-warm - which is why cachyos-7900xtx leads it.
      prefer_order:
        - cachyos-7900xtx
        - kserve-a5000
        - bazzite-5090
        - laptop-rtx5000
      warm_preference: strict
      warm_bonus_rank_shift: null
      allow_cold_start: true
      min_vram_gb: null
      min_free_vram_gb: null
      resolves_today: true
    cluster-only:
      description: >-
        Never leave the cluster. The correct policy for anything that must not depend on a workstation being awake.
      prefer_order:
        - kserve-a5000
      warm_preference: ignored
