# Grok CLI. Flags checked against grok 1.0.92 --help.
name = "grok"
display = "Grok CLI"
vendor = "xAI"
bins = ["grok"]
efforts = ["low", "medium", "high", "xhigh"]
effort_flag = "--effort <level>"
self_update = "update"

[auth]
login = ["grok", "login"]

[session]
resume = ["grok", "--resume", "{id}"]
verified = "1.0.92"

[modes]
verified = "1.0.92"
read-only = ["--permission-mode", "plan"]
# ask is pinned, so a permission mode in Grok's config can't loosen it.
ask = ["--permission-mode", "default"]
edits = ["--permission-mode", "acceptEdits"]
auto = ["--permission-mode", "auto"]
yolo = ["--always-approve"]
mode_flags = ["--permission-mode"]
