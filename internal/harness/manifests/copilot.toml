# GitHub Copilot CLI. AFK doesn't launch it yet, so it has no mode table.
name = "copilot"
display = "GitHub Copilot CLI"
vendor = "GitHub"
bins = ["copilot"]
npm_package = "@github/copilot"
login_note = "copilot (then /login)"

[skills]
# From Copilot CLI's documentation, not checked against an install.
dir = "~/.copilot/skills"
# Copilot CLI reads .github/skills, .claude/skills and .agents/skills in a repository (its documentation).
project_dir = ".agents/skills"
format = "skill-md"

[mcp]
# "mcpServers" in mcp-config.json. From Copilot CLI's documentation, not
# checked against an install.
file = "~/.copilot/mcp-config.json"
# Copilot CLI reads a repository's .mcp.json itself (in trusted folders).
project_file = ".mcp.json"
format = "copilot-json"
