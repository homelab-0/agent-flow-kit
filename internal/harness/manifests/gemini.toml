# Gemini CLI. AFK doesn't launch it yet, so it has no mode table.
name = "gemini"
display = "Gemini CLI"
vendor = "Google"
bins = ["gemini"]
npm_package = "@google/gemini-cli"
login_note = "gemini"

[skills]
# From Gemini CLI's documentation, not checked against an install.
dir = "~/.gemini/skills"
# Gemini CLI reads .agents/skills (and .gemini/skills) in a workspace (its documentation).
project_dir = ".agents/skills"
format = "skill-md"

[mcp]
# "mcpServers" in settings.json. From Gemini CLI's documentation, not
# checked against an install.
file = "~/.gemini/settings.json"
format = "gemini-json"
