# Codex CLI. Flags checked against codex-cli 0.172.0 --help and exec --help:
# --ask-for-approval takes on-request or never, and codex exec has no -a.
name = "codex"
display = "Codex CLI"
vendor = "OpenAI"
bins = ["codex"]
npm_package = "@openai/codex"
efforts = ["low", "medium", "high", "xhigh", "max", "ultra"]
effort_flag = "-c model_reasoning_effort=<level>"

[auth]
login = ["codex", "login"]
device_login = ["codex", "login", "--device-auth"]
status = ["codex", "login", "status"]
errors = ["refresh token", "not logged in", "401 unauthorized"]

[modes]
verified = "0.172.0"
read-only = ["--sandbox", "read-only", "--ask-for-approval", "never"]
# ask: a read-only sandbox that asks before anything beyond reading
# (writes, commands outside the sandbox). Pinned, so a sandbox_mode or
# approval_policy in ~/.codex/config.toml can't loosen it. read-only
# never asks, so it can never write.
ask = ["--sandbox", "read-only", "--ask-for-approval", "on-request"]
# edits (edit freely, ask before commands) has no Codex equivalent.
auto = ["--sandbox", "workspace-write", "--ask-for-approval", "never"]
yolo = ["--dangerously-bypass-approvals-and-sandbox"]
bypass_flags = ["--yolo"]
dir_flags = ["--cd", "-C"]
# Codex reads a project's .codex/config.toml only for a project trusted in
# ~/.codex/config.toml.
project_config = "trusted"
# Other ways to change the sandbox or approvals; --pass refuses them
# outside yolo. -c sets any config key, so only the keys that matter are
# refused.
mode_flags = ["--sandbox", "-s", "--ask-for-approval", "-a", "--full-auto", "--profile", "-p", "--add-dir"]
config_flags = ["-c", "--config"]
config_keys = ["sandbox_mode", "approval_policy", "sandbox_workspace_write", "sandbox_permissions", "profile", "profiles", "projects"]

# codex exec can't ask (it has no --ask-for-approval), so one-shot runs
# have no ask: ask runs read-only, pinned so ~/.codex/config.toml can't
# loosen it, and AFK says so.
[modes.print]
read-only = ["--sandbox", "read-only"]
auto = ["--sandbox", "workspace-write"]
yolo = ["--dangerously-bypass-approvals-and-sandbox"]

[skills]
# Codex reads $CODEX_HOME/skills (default ~/.codex/skills). From Codex's
# documentation, not checked against an install.
dir = "$CODEX_HOME/skills|~/.codex/skills"
# Codex reads a repository's .agents/skills itself.
project_dir = ".agents/skills"
format = "skill-md"

[mcp]
# [mcp_servers.<name>] tables in config.toml. From Codex's documentation,
# not checked against an install.
file = "$CODEX_HOME/config.toml|~/.codex/config.toml"
format = "codex-toml"
# A trusted project's .codex/config.toml, from Codex's documentation.
project_file = ".codex/config.toml"
