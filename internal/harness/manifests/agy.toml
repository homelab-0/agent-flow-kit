# Antigravity CLI. Flags checked against agy 1.5.18 --help.
name = "agy"
display = "Antigravity CLI"
vendor = "Google"
bins = ["agy"]
efforts = ["low", "medium", "high", "xhigh", "max"]
effort_flag = "--effort <level>"
self_update = "update"

[auth]
login = ["agy", "login"]

[session]
resume = ["agy", "--resume", "{id}"]

# One "id<TAB>name" line per model the signed-in plan includes.
[model_list]
command = ["agy", "models"]
format = "tsv"
verified = "1.5.19"

[modes]
verified = "1.5.18"
read-only = ["--mode", "plan"]
ask = []
edits = ["--mode", "accept-edits"]
auto = ["--mode", "auto"]
yolo = ["--dangerously-skip-permissions"]
mode_flags = ["--mode"]
