# Claude Code. Flags checked against claude 2.1.332 --help.
name = "claude"
display = "Claude Code"
vendor = "Anthropic"
bins = ["claude"]
npm_package = "@anthropic-ai/claude-code"
efforts = ["low", "medium", "high", "xhigh", "max"]
effort_flag = "--effort <level>"
self_update = "update"

[auth]
login = ["claude", "auth", "login"]
status = ["claude", "auth", "status"]
errors = ["authentication_failed", "invalid api key", "please run /login"]

[modes]
verified = "2.1.332"
read-only = ["--permission-mode", "plan"]
# ask is pinned, so a defaultMode in Claude's settings can't loosen it.
ask = ["--permission-mode", "manual"]
edits = ["--permission-mode", "acceptEdits"]
auto = ["--permission-mode", "auto"]
yolo = ["--dangerously-skip-permissions"]
# claude -p skips the workspace trust dialog, and a project's hooks then
# run unasked (checked on 2.1.332). This keeps it to ~/.claude.
user_config = ["--setting-sources", "user"]
# Other ways to change what Claude may do without asking; --pass refuses
# them outside yolo.
mode_flags = ["--permission-mode", "--allow-dangerously-skip-permissions", "--allowedTools", "--allowed-tools", "--settings", "--setting-sources"]

[skills]
# Claude Code reads ~/.claude/skills/<name>/SKILL.md (or under
# CLAUDE_CONFIG_DIR).
dir = "$CLAUDE_CONFIG_DIR/skills|~/.claude/skills"
format = "skill-md"
