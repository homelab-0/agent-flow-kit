# OpenCode. Checked against opencode v2.4.2: only `opencode run` takes --auto.
name = "opencode"
display = "OpenCode"
vendor = "SST"
bins = ["opencode"]
npm_package = "opencode-ai"
efforts = ["low", "medium", "high"]
effort_flag = "--variant <level>"
self_update = "upgrade"

[auth]
login = ["opencode", "auth", "login"]

# One "provider/model" line per model.
[model_list]
command = ["opencode", "models"]
format = "lines"
verified = "2.4.2"

[modes]
verified = "2.4.2"
ask = []

[modes.print]
ask = []
yolo = ["--auto"]

[skills]
# From OpenCode's documentation, not checked against an install.
dir = "~/.config/opencode/skills"
# OpenCode reads .opencode/skills, .claude/skills and .agents/skills in a repository (its documentation).
project_dir = ".agents/skills"
format = "skill-md"

[mcp]
# The "mcp" object in opencode.json. From OpenCode's documentation, not
# checked against an install.
file = "~/.config/opencode/opencode.json"
format = "opencode-json"
# opencode.json in the project root, from OpenCode's documentation.
project_file = "opencode.json"
