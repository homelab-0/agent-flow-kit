# usage-prices.yaml — declared USD-per-million-token API-equivalent prices for
# `agent-flow-kit usage-report`. OBSERVABILITY ONLY: feeds a cost ESTIMATE in
# a report, never a constant in code, and never a routing input — routing
# prices and entitlements live in the catalog, not here.
#
# Grammar (read by lib/afk-usage.sh with a small awk parser, not a YAML
# library): a top-level `model:` line, followed by 2-space-indented
# `key: number` lines. A model missing here reports an "unknown" cost rather
# than failing the run; only a missing/unreadable copy of this file refuses
# the whole verb (USAGE_PRICES_UNREADABLE). Illustrative list prices, not a
# live feed — correct them here if list pricing changes.

