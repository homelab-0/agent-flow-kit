schema: afk-harness-bindings/1

# Launcher capability declarations, not routing policy. There are no
# priorities, task tags, fallback rules, or wildcard pairs here. A binding is
# useful only when /v1/route independently admits the same exact triple.
bindings:
  - harness: claude
    model_profile: claude/strong
    entitlement_pool: anthropic-max
    cost_class: subscription
    launch_class: claude-native

  - harness: claude
    model_profile: local-code-standard
    entitlement_pool: null
    cost_class: free
    launch_class: claude-gateway

  - harness: claude
    model_profile: local-general
    entitlement_pool: null
    cost_class: free
    launch_class: claude-gateway

  - harness: codex
    model_profile: openai/strong
    entitlement_pool: openai-plus
    cost_class: subscription
    launch_class: codex-native

  - harness: opencode
    model_profile: openai/strong
    entitlement_pool: openai-plus
    cost_class: subscription
    launch_class: opencode
    physical_model: openai/gpt-5.6-sol
    auth_provider: OpenAI
    auth_kind: oauth
    efforts:
      low: {model: openai/gpt-5.6-sol, variant: low}
      medium: {model: openai/gpt-5.6-sol, variant: medium}
      high: {model: openai/gpt-5.6-sol, variant: high}
      xhigh: {model: openai/gpt-5.6-sol, variant: xhigh}

  - harness: opencode
    model_profile: minimax/strong
    entitlement_pool: minimax-max
    cost_class: subscription
    launch_class: opencode
    physical_model: minimax/m3
    auth_provider: MiniMax (minimaxi.com)
    auth_kind: api
    funding_attestation: minimax-token-plan
    efforts:
      high: {model: minimax-cn/MiniMax-M3, variant: thinking}
      xhigh: {model: minimax-cn/MiniMax-M3, variant: thinking}
