# subscriptions.yaml — LAUNCHER CONFIGURATION. Not a routing authority.
#
# This file used to be "the single source of truth for WHAT you can route to":
# tiers, per-model use_for tables, fallback chains, budget rules and provider
# strengths. All of that has moved to the central control plane. POST /v1/route
# is now the sole routing authority on this path, and the catalog behind it is
# the only place a harness/profile/effort combination is declared legal.
#
# What is left here is the small set of facts the LAUNCHER needs and the router
# cannot supply: where the router lives, which environment variable carries the
# caller token, which trusted catalog document the stamp validator loads, and
# which local binary implements each harness.
#
# Two rules that are not negotiable:
#   1. NOTHING in this file may name a harness, a model profile or an effort for
#      a task. Choosing those is /v1/route's job. If you find yourself adding a
#      routing table here, you are rebuilding the thing this file was demoted to
#      stop being.
#   2. NO SECRET LIVES HERE. `caller_token_env` names an environment variable;
#      it never holds its value. Native harness credentials are owned by the
#      harnesses and by Orca, and no field here can express one.

launcher:
  # The central control plane. dispatch.sh calls POST /v1/place against it when
  # a stamp says placement_required; make-stamp.sh calls POST /v1/route.
  router_endpoint: https://agent-router.homelab0.org

  # NAME of the environment variable holding the caller bearer token. The value
  # is provisioned outside this repo (1Password / the cluster secret) and is
  # never written here.
  caller_token_env: AGENT_ROUTER_TOKEN

  # The trusted catalog document agent-stamp-validate loads. This is TRUSTED
  # POLICY MATERIAL and is always launcher/installer configuration — it is never
  # accepted from a stamp or from stdin, because a workload must not be able to
  # choose its own policy authority. Equivalent to setting
  # AGENT_STAMP_VALIDATE_CATALOG_PATH, which takes precedence when set.
  # Point it at the catalog DOCUMENT itself, never at the ConfigMap wrapper.
  catalog_path: ""

  # The pre-execution stamp validator. Fail-closed, run immediately before every
  # launch; its 0/1/2 exits are remapped into dispatch.sh's 4/5 band.
  stamp_validator: agent-stamp-validate

  # Where BMAD persona files live. dispatch.sh injects $agent_dir/<persona>.md
  # for the persona named by the story's `persona:` key, and FAILS LOUDLY when
  # that file is missing — persona injection must never silently no-op.
  agent_dir: _bmad/bmm/agents

  # The operator's explicitly approved HOME for the claude launch. Empty means
  # "resolve it from the passwd database and validate it", which is the normal
  # case. It is never the ambient $HOME passed through blind, and never a
  # hard-coded path. Only Claude's DEFAULT store under this HOME is supported:
  # a non-default CLAUDE_CONFIG_DIR or an Orca-managed Claude store fails the
  # launch closed.
  approved_home: ""

  # PATH admitted into the sanitized child environment. Empty derives it from
  # the harness binary's own location plus the system directories.
  approved_path: ""

  # How long to wait for the harness to print its in-band exit line before
  # giving up. `orca terminal wait --for exit` does not fire (the terminal
  # outlives its command), so the "<HARNESS>_EXIT=" line is the only reliable
  # completion signal and this timeout is the only bound on waiting for it.
  launch_timeout_seconds: 5400

  # Local binary implementing each harness name from the catalog's harness axis.
  # This maps a NAME to an EXECUTABLE. It does not decide which harness runs.
  harness_binaries:
    claude: claude
    codex: codex

# ---------------------------------------------------------------------------
# Subscriptions, for humans only.
#
# Recorded so an operator knows which accounts the native harnesses are signed
# into and what a rate limit will feel like. NOTHING reads this block. It is not
# a routing input, and adding a tier or a use_for list to it will not change any
# decision — /v1/route already knows the entitlement picture from the catalog's
# entitlement_pools.
# ---------------------------------------------------------------------------
subscriptions_note:
  claude: >-
    Claude Max 20x. One weekly pool shared by every machine signed into the
    account. `claude -p` draws normal plan limits. Never export ANTHROPIC_API_KEY
    and never pass --bare: either silently moves the session to metered API
    billing, and --bare disables the subscription path by construction.
  openai: >-
    ChatGPT Plus. Separate weekly/5h Codex limits, independent of the Claude
    pool, and the smallest paid pool here. An authenticated run transports over
    the ChatGPT subscription endpoint; an unauthenticated one falls through to
    api.openai.com and is refused, which is the signal that a run used the
    subscription rather than API billing.
  exhaustion: >-
    A rate-limited pool is NOT handled by a local fallback any more. dispatch.sh
    has no fallback chain: re-routing is a NEW /v1/route call and a NEW stamp,
    made by the planning session with the human in the loop. A silent local
    re-route was a routing decision made after acceptance, with no stamp, no
    expiry and no validation — which is exactly what the control plane exists to
    prevent.
