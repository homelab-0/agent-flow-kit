# context-budget-policy.yaml — the kit's declared context-budget policy.
#
# LAUNCHER CONFIGURATION, exactly like subscriptions.yaml: it is installed with
# the kit and read by the launcher only. It is NEVER read from a story, from an
# execution stamp, or from anything a workload can write — a workload that could
# choose its own thresholds would not be under a budget at all.
#
# Every threshold and the estimate method live HERE and nowhere else. There is
# no default in code: a policy file that is unreadable, malformed or missing a
# key refuses dispatch with BUDGET_POLICY_UNREADABLE rather than falling back to
# a constant nobody declared. Tuning a value is a policy edit, not a code
# change; the accepted values below are the owner-accepted defaults of
# 2026-08-26 (PRD addendum FR-98, FR-99).
#
# For tests and for a host that deliberately runs a different policy, the path
# is overridable with $AGENT_FLOW_BUDGET_POLICY or launcher.budget_policy.

schema_version: 1

# How planned payload BYTES become an estimated token count. The id is part of
# the contract: a result records the method it used, so an estimate is never
# comparable across methods by accident.
#   bytes4-v1  ceil(bytes / 4)
estimate_method: bytes4-v1

# Ratios of estimate (or observed usage) to the routed context window.
# A ratio EQUAL to a threshold counts as crossing it.
sizing_risk_ratio: 0.60     # >= this, dispatch proceeds and records SIZING_RISK
checkpoint_ratio: 0.70      # >= this, a worker must checkpoint (lane B)
continuation_ratio: 0.85    # >= this, pre-dispatch refuses; in flight, continue

# How many continuation CYCLES one story may consume before a human decides.
# Counted as the LENGTH of the story's append-only continuation ledger
# (`<story>.continuations.json`), which gets one entry per continuation launch
# and is never rewritten or pruned — not from a stored counter, and not from
# per-cycle results a re-dispatch could overwrite. At the cap the next
# continuation refuses unless the story carries a `continuation_decision:`
# naming that cycle.
continuation_cap: 2

# The stable reason codes this policy's outcomes are reported under. Automation
# reads these, so they are declared here rather than discovered by reading the
# implementation.
reason_codes:
  - CONTEXT_WINDOW_UNDECLARED   # the catalog declares no window for the profile
  - SIZING_REFUSED              # pre-dispatch estimate at or past continuation
  - SIZING_RISK                 # pre-dispatch estimate in the risk band
  - PAYLOAD_REF_MISSING         # a declared payload_refs path does not exist
  - BUDGET_POLICY_UNREADABLE    # this file could not be read or is incomplete
  - USAGE_UNOBSERVABLE          # the harness publishes no usage under its frozen launch
  - HIGH_USAGE                  # the run ENDED at or past checkpoint_ratio (sizing signal)
  - WINDOW_DISAGREEMENT         # harness-reported window differs from the catalog's
  - CHECKPOINT_ARTIFACT_INVALID # a checkpoint was present but did not validate
  - CHECKPOINT_ARTIFACT_STALE   # the checkpoint on disk is byte-identical to the one this attempt started with
  - CONTINUATION_ARTIFACT_INVALID # a continuation was signalled without valid evidence
  - WINDOW_UNCORROBORATED       # the envelope carries no window for the routed model
  - CONTINUATION_CAP_REACHED    # the story has spent every continuation this policy allows
  - CONTINUATION_REFUSED        # a continuation cycle was turned away by the sizing refusal
  - CONTINUATION_ARTIFACT_UNBOUND # the hand-over artifact names no story, so nothing binds it to this one
  - CYCLE_ALREADY_RETAINED      # this continuation cycle already ran; a continuation is always the NEXT cycle
  - CONTINUATION_STAMP_REFRESH_REQUIRED # a continuation's stamp no longer validates; the planner re-routes and re-stamps
  - REPEATED_CONTINUATION       # this cycle is a continuation (the PM's story-sizing signal)

# The bounded budget state a dispatch reports. All four are declared here and
# published by `agent-flow-kit schema`; pre-dispatch produces only OK and
# NOT_EVALUATED, the other two belong to in-flight usage evaluation.
budget_states:
  - OK
  - CHECKPOINT_DUE
  - CONTINUATION_REQUIRED
  - NOT_EVALUATED
