schema: afk-persona-threshold-rule/1
story: AFK-PORT-1.7
status: advisory
generated_from: _bmad-output/implementation-artifacts/evidence/AFK-PORT-1.7/results/
rule_source: scaffold/matrix.yaml (recommendation_rule), encoded verbatim below

# Advisory, exactly like Story 1.5's sizing policy. This rule NEVER blocks a
# launch, changes a route, or edits the catalog; it emits a suggested persona
# mode for a profile. It records no prohibition: the persona-independence
# contract in follow-on-worker-subdelegation.md stands unchanged, and adopting
# any output of this rule is a separate explicit reconciliation.

inputs:
  window_tokens:
    type: integer
    nullable: true
    description: >
      The profile's declared context window. Catalog min_context for local
      profiles; the harness result envelope's contextWindow for vendor
      profiles. Null when the adapter reports none (e.g. codex).
  persona_payload_tokens:
    type: integer
    description: >
      Estimated tokens of the persona payload plus the composed story plus the
      dispatch prompt. Preferred source: the harness envelope's first-turn
      input tokens. Fallback, used throughout this spike: ceil(bytes/4).
  gate_pass_rate_by_mode:
    type: "map<mode, {passed: integer, total: integer}>"
    modes: [full, compact, none]
    description: >
      Deterministic gate verdicts over the canary tasks, per persona mode.
      Gates are pre-declared before any run; transcripts are never graded.

outputs:
  persona_mode:
    type: enum
    values: [full, compact, unsuitable, NOT_EVALUATED]
    per: profile
  advisory: true
  blocking: false

evaluation:
  # Evaluated in order; the first matching clause wins.
  - id: not_evaluated
    when: "window_tokens == null or gate_pass_rate_by_mode is missing for the mode under test"
    emit: NOT_EVALUATED
    note: >
      NFR-14. An adapter that cannot supply the measurement reports
      NOT_EVALUATED and never blocks another harness's evaluation.

  - id: full
    when:
      - "gate_pass_rate_by_mode.full.passed == gate_pass_rate_by_mode.full.total"
      - "headroom_fraction(full) >= 0.50"
      - "payload_ratio(full) <= 0.05"
      - "pass_rate(full) >= 0.6667"
    emit: full

  - id: compact
    when:
      - "gate_pass_rate_by_mode.compact.passed == gate_pass_rate_by_mode.compact.total"
      - "headroom_fraction(compact) >= 0.50"
      - "payload_ratio(compact) <= 0.05"
      - "pass_rate(compact) >= 0.6667"
    emit: compact

  - id: unsuitable
    when: "otherwise"
    emit: unsuitable

derived:
  payload_ratio: "persona_payload_tokens / window_tokens"
  headroom_tokens: "window_tokens - persona_payload_tokens"
  headroom_fraction: "headroom_tokens / window_tokens"
  pass_rate: "gate_pass_rate_by_mode[mode].passed / gate_pass_rate_by_mode[mode].total"

guards:
  payload_ratio_guard:
    threshold: 0.05
    meaning: >
      The persona payload must be at most 5% of the window. A declared policy
      default, not a measured limit. In this spike no local cell exceeded
      0.0379, so the guard was never the binding condition — it exists to
      catch a future profile with a much smaller window, not to explain any
      result recorded here.
  quality_floor:
    threshold: 0.6667
    meaning: >
      At least 2 of 3 canary gates must pass in the mode being recommended.
      Subsumed by the matrix rule's own "every task passes" condition; kept
      explicit so a larger canary set can loosen the all-pass condition
      without losing a floor.

# Applied to this spike's data, for traceability. persona_payload_tokens is the
# largest of the mode's three cells (the worst case the guards must clear).
worked_examples:
  - profile: local-code-standard
    window_tokens: 65536
    persona_payload_tokens: {full: 2487, compact: 533, none: 468}
    gate_pass_rate_by_mode: {full: {passed: 1, total: 3}, compact: {passed: 2, total: 3}, none: {passed: 3, total: 3}}
    emit: unsuitable
    binding_condition: "neither full nor compact passed every task; ratio and headroom guards were satisfied in both"
  - profile: local-general
    window_tokens: 65536
    persona_payload_tokens: {full: 2325, compact: 455, none: 431}
    gate_pass_rate_by_mode: {full: {passed: 1, total: 3}, compact: {passed: 0, total: 3}, none: {passed: 1, total: 3}}
    emit: unsuitable
    binding_condition: "same; ratio and headroom guards satisfied"
  - profile: claude/strong
    window_tokens: 1000000
    persona_payload_tokens: {full: 2762}
    gate_pass_rate_by_mode: {full: {passed: 3, total: 3}}
    emit: full
  - profile: openai/strong
    window_tokens: null
    gate_pass_rate_by_mode: {full: {passed: 0, total: 3}}
    emit: NOT_EVALUATED
    binding_condition: "adapter reports no context window, and the full cells never reached the model (codex exec usage error, exit 2)"

limits:
  # What this rule structurally CANNOT see. Read before applying it.
  - >
    It cannot see behavioural failure. Every local failure in this spike was
    behavioural, not capacity: the dominant class was path resolution outside
    the worktree producing permission denials (116 denials across 15 local
    cells, all of that one class), and the persona payload never exceeded
    3.79% of the window. This rule would have passed every payload and
    headroom guard on cells that failed their gates. It infers the behaviour
    only through gate_pass_rate, after the fact.
  - >
    It cannot see run-to-run variance. Two profile ids resolving to the same
    physical model, placement and window scored 6/9 and 2/9 here. With one run
    per cell the rule's inputs are unreplicated, so its output can flip
    between identical configurations. Repetition is the fix; this spike did
    not do it.
  - >
    It cannot see whether a persona is the cause of anything. Mode `none`
    failed cells too (lg-none-T1, lg-none-T3), so a per-mode pass rate does
    not isolate the persona payload as the variable.
  - >
    It cannot see task difficulty or task shape. Three small deterministic
    canaries stand in for all work; nothing here speaks to tasks whose
    context actually approaches the window.
  - >
    It cannot see gate/dispatch disagreement. In lg-full-T2 the gate passed
    while dispatch recorded exit 3 because the worker printed NEEDS-HUMAN.
    The rule reads gate verdicts only and would score that cell a pass.
  - >
    Because of the above, an `unsuitable` output is a prompt to investigate,
    never an authority to exclude a profile or to strip persona semantics.
