schema: afk-spike-matrix/1
story: AFK-PORT-1.7
profiles:            # selectable local profiles, catalog 1.6.0 (routed facts, recorded by the coordinator)
  - id: local-code-standard
    window_tokens: 65536
  - id: local-general
    window_tokens: 65536
baseline:            # vendor baseline, both approved harnesses
  - harness: claude
    profile: claude/strong
  - harness: codex
    profile: openai/strong
modes: [full, compact, none]
tasks: [T1, T2, T3]
measurements:
  payload_tokens: "input tokens reported by the harness result envelope for the first turn; fallback ceil(bytes/4) of persona + story + prompt"
  window_tokens: "catalog min_context for local profiles; result-envelope contextWindow for vendor profiles"
  headroom_tokens: "window_tokens - payload_tokens"
  quality: "deterministic gate verdict per task: PASS or FAIL"
recommendation_rule: "full if every task passes in full mode with headroom >= 50% of window; compact if only compact passes those conditions; unsuitable otherwise"
